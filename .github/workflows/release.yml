# Build, check and publish jax-metal-shim. Runs only for version tags (v*) or by hand; see
# RELEASING.md. PyPI publishing waits for approval of the `pypi` environment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14  # Apple silicon: the shim library is built for arm64 only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' shim/python/jax_plugins/metal_shim/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m build --outdir dist shim
      - name: Check the distributions
        run: |
          python -m twine check dist/*
          wheel=$(ls dist/*-py3-none-macosx_14_0_arm64.whl)
          unzip -l "$wheel" | grep -q 'jax_plugins/metal_shim/pjrt_plugin_metal_shim.dylib'
          if unzip -l "$wheel" | grep -q pjrt_plugin_metal_14.dylib; then
            echo "Apple's plugin must not be packaged" >&2; exit 1
          fi
          unzip -q -o "$wheel" 'jax_plugins/metal_shim/pjrt_plugin_metal_shim.dylib' -d unpacked
          lipo -archs unpacked/jax_plugins/metal_shim/pjrt_plugin_metal_shim.dylib | grep -qx arm64
      - name: Install, fetch Apple's plugin, inspect
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -m jax_plugins.metal_shim fetch
          /tmp/check/bin/python -m jax_plugins.metal_shim info
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Draft a GitHub release with the distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --draft --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
