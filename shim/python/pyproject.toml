[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-metal-shim"
version = "0.1.0"
description = "Run current JAX on Apple GPUs through Apple's jax-metal 0.1.1 PJRT plugin"
requires-python = ">=3.10"
dependencies = ["jax>=0.12", "jaxlib>=0.12"]

[project.entry-points.jax_plugins]
metal_shim = "jax_plugins.metal_shim"

[tool.setuptools]
packages = ["jax_plugins.metal_shim"]

[tool.setuptools.package-data]
"jax_plugins.metal_shim" = ["*.dylib"]
